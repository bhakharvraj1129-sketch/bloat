<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bloat — Silver / Design prototype</title><style>
:root{--ground:#f5f5f6;--surface:#fff;--line:#dedee2;--ink:#171719;--muted:#626269;--subtle:#eeeef0;--control:#85858e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--ground);color-scheme:light}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}a{color:inherit;text-decoration:none}button,a,input,select{touch-action:manipulation}button,a.btn{cursor:pointer}button{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #171719;outline-offset:4px}button:disabled{cursor:not-allowed;opacity:.5}h1,h2,h3,p{margin:0}h1{font-size:44px;line-height:1.08;letter-spacing:-1.8px;font-weight:600}h2{font-size:24px;letter-spacing:-.6px;font-weight:600}h3{font-size:17px;font-weight:600}p{line-height:1.6}.muted,small{color:var(--muted)}small{font-size:13px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:650;color:var(--muted);text-transform:uppercase}.brand{font-size:27px;letter-spacing:-1.4px;font-weight:650}.top{background:#fff;border-bottom:1px solid var(--line);padding:20px 6vw;display:flex;gap:24px;align-items:center}.top nav{margin-left:auto;display:flex;align-items:center;gap:26px;font-size:14px}.btn,button{border:1px solid var(--line);border-radius:12px;padding:13px 18px;min-height:46px;background:#fff;font-weight:550;display:inline-flex;align-items:center;justify-content:center;gap:8px}.primary{background:var(--ink);border-color:var(--ink);color:white}.quiet{background:transparent;border-color:transparent}.small{padding:10px 14px;font-size:13px}.row{display:flex;align-items:center;gap:12px}.spread{justify-content:space-between}.wrap{flex-wrap:wrap}.stack{display:grid;gap:20px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px}.hero{max-width:1160px;margin:auto;padding:92px 28px 72px;display:grid;grid-template-columns:1.1fr 1fr;gap:90px;align-items:center}.hero h1{font-size:76px;letter-spacing:-4px;line-height:1.02;margin:24px 0}.hero p{font-size:18px;max-width:430px}.hero .row{margin-top:28px}.device{background:#e9e9ec;padding:28px;border-radius:36px}.mini{max-width:330px;margin:auto;border:7px solid white;border-radius:30px;background:#f7f7f8;padding:24px 18px;box-shadow:0 20px 50px #17171912}.mini h2{font-size:27px;margin:16px 0}.mini .card{padding:18px;margin-top:14px}.metric{font-size:64px;letter-spacing:-3px;font-weight:550;line-height:1.15;font-variant-numeric:tabular-nums}.metric small{font-size:18px;letter-spacing:0}.bars{display:flex;align-items:flex-end;gap:14px;height:115px;border-bottom:1px solid var(--line);margin-top:24px}.bars i{flex:1;background:#b8b8bf;border-radius:5px 5px 0 0}.bars i:last-child{background:#171719}.days{display:flex;justify-content:space-around;font-size:11px;color:var(--muted);margin-top:10px}.section{max-width:1160px;margin:auto;padding:40px 28px 72px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.step{font-size:13px;color:var(--muted);display:block;margin-bottom:36px}.section h2{margin-bottom:28px}.section h3{margin-bottom:12px}footer{padding:36px 6vw;background:#fff;border-top:1px solid var(--line);display:flex;gap:24px;flex-wrap:wrap;font-size:13px}.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 34px)}.side{padding:32px 22px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:26px}.side nav{display:grid;gap:8px}.side a{padding:14px;border-radius:12px;color:var(--muted);font-size:14px}.side a.active{background:var(--subtle);color:var(--ink);font-weight:600}.side .brand{padding:0;color:var(--ink)}.side small{margin-top:auto;padding:12px}.workspace{padding:48px;max-width:1240px;width:100%;margin:auto}.pagehead{margin-bottom:32px}.pagehead .eyebrow{margin-bottom:12px}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:24px}.wide{grid-column:1/-1}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}.actions button{justify-content:flex-start}.entry{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:20px 0;gap:12px}.entry:last-child{border:0}.entry small{display:block;margin-top:5px}.ring{width:64px;height:64px;border:8px solid #dddde1;border-top-color:#171719;border-right-color:#171719;border-radius:50%;display:grid;place-items:center;font-size:17px;font-variant-numeric:tabular-nums}.chart{width:100%;height:160px;margin-top:28px}.tabs{display:flex;background:#e9e9ec;border-radius:10px;padding:4px;gap:4px}.tabs button{min-height:34px;border:0;padding:6px 14px;background:transparent;font-size:12px}.tabs .selected{background:#fff}.auth{min-height:80vh;display:grid;place-items:center;padding:36px 20px}.auth .card{max-width:440px;width:100%;padding:38px}.auth h1{font-size:34px;letter-spacing:-1px}.field{display:grid;gap:8px;font-size:14px;margin-top:20px}.field input,.field select{width:100%;border:1px solid var(--control);border-radius:12px;min-height:48px;padding:12px;background:#fff}.full{width:100%}.divider{border-top:1px solid var(--line);margin:24px 0}.document{max-width:740px;margin:50px auto;padding:0 24px 70px}.document h1{margin:24px 0}.document h2{margin:32px 0 12px}.document p{margin-top:14px}.badge{display:inline-flex;border:1px solid var(--line);border-radius:30px;padding:6px 10px;font-size:11px;font-weight:600}.demo{background:#171719;color:white;font-size:11px;padding:10px 20px;text-align:center;letter-spacing:.4px}.bottom{display:none}.numbergrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}.numbergrid button{padding:12px}.numbergrid button[aria-pressed=true]{background:#171719;color:#fff}.note{padding:16px;background:#f0f0f2;border-radius:12px;font-size:13px;line-height:1.6}.labelrow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:24px;padding:28px;width:min(480px,calc(100% - 24px));max-height:88dvh;overflow:auto}dialog::backdrop{background:#17171966}dialog h2{margin-bottom:8px}#toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#171719;color:#fff;padding:14px 22px;border-radius:12px;z-index:9;max-width:90%;font-size:14px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:16px 8px;border-bottom:1px solid var(--line)}.mobileOnly{display:none}.activepill{background:#171719;color:#fff}.linechart{fill:none;stroke:#171719;stroke-width:2.5}.previewlabel{font-size:11px;color:var(--muted);margin:14px 0;text-transform:uppercase;letter-spacing:1px}@media(max-width:900px){.hero{gap:32px;padding-top:52px}.hero h1{font-size:58px}.workspace{padding:32px 24px}.shell{grid-template-columns:180px 1fr}.grid{grid-template-columns:1fr}.top nav{gap:14px}.three{gap:12px}}@media(max-width:640px){h1{font-size:34px}.hero{grid-template-columns:1fr;padding:42px 22px;gap:36px}.hero h1{font-size:56px;letter-spacing:-2.8px}.device{padding:20px}.three{grid-template-columns:1fr}.top{padding:18px 22px}.top nav a:not(.btn){display:none}.section{padding:32px 22px}.shell{display:block}.side{display:none}.workspace{padding:28px 20px 110px}.card{padding:22px}.pagehead{margin-bottom:24px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 8px max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);z-index:3}.bottom a{display:grid;gap:5px;text-align:center;font-size:11px;color:var(--muted);min-height:46px;align-content:center}.bottom a.active{color:var(--ink);font-weight:700}.bottom svg{margin:auto}.mobileOnly{display:block}.desktopOnly{display:none}.auth .card{padding:26px}.row.wrap .btn{flex:1}.metric{font-size:56px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style><body><div class="demo">DESIGN PROTOTYPE · Synthetic examples · No account, health data or server connection</div><div id="app"></div><dialog id="sheet"></dialog><div id="toast" role="status" hidden></div><script>
const app=document.querySelector('#app'),sheet=document.querySelector('#sheet');let strength=null,ongoing=false,meals=[],range='7 days';
const icons={today:'<path d="M3 11 12 3l9 8v10h-6v-7H9v7H3z"/>',history:'<rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 11h16"/>',insights:'<path d="M4 20V10m8 10V4m8 16v-7"/>',me:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>'};
const icon=n=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">${icons[n]}</svg>`;
const link=(r,t,c='')=>`<a href="#${r}" class="${c}">${t}</a>`;const btn=(t,a,c='')=>`<button class="${c}" data-action="${a}">${t}</button>`;
const chart=()=>`<svg class="chart" viewBox="0 0 500 170" role="img" aria-label="Synthetic seven-day symptom strength chart, values 5, 4, 6, 3, 4, 2, 3 out of 10"><g stroke="#dedee2"><path d="M25 20H480M25 65H480M25 110H480M25 150H480"/></g><g fill="#626269" font-size="11"><text x="0" y="23">10</text><text x="6" y="112">3</text><text x="6" y="153">0</text><text x="28" y="168">M</text><text x="102" y="168">T</text><text x="175" y="168">W</text><text x="249" y="168">T</text><text x="322" y="168">F</text><text x="396" y="168">S</text><text x="468" y="168">S</text></g><path class="linechart" d="M30 85L103 98L176 72L250 111L323 98L397 124L470 111"/><circle cx="470" cy="111" r="5" fill="#171719"/></svg>`;
const bars=()=>`<div class="bars" aria-hidden="true">${[64,50,78,38,50,24,38].map(h=>`<i style="height:${h}%"></i>`).join('')}</div><div class="days"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>`;
const footer=()=>`<footer><span class="brand">bloat.</span>${['about','how','privacy','terms','contact','help'].map(r=>link(r,({how:'How it works',help:'Medical help'})[r]||r[0].toUpperCase()+r.slice(1))).join('')}<p class="muted" style="flex-basis:100%">A wellness diary for adults. Not a diagnosis or an emergency service.</p></footer>`;
const top=()=>`<header class="top">${link('home','bloat.','brand')}<nav>${link('how','How it works')}${link('about','About')}${link('contact','Contact')}${link('signin','Sign in','btn small primary')}</nav></header>`;
function shell(content,r){let tabs=[['today','Today'],['history','History'],['insights','Patterns'],['me','You']];let nav=place=>`<nav class="${place}" aria-label="${place==='bottom'?'Mobile':'Main'} navigation">${tabs.map(([id,name])=>link(id,`${icon(id)} ${name}`,r===id?'active':'')).join('')}</nav>`;return `<div class="shell"><aside class="side">${link('home','bloat.','brand')}<span class="eyebrow">Your daily record</span>${nav('')}${link('report','Reports')}${link('learn','Learn')}<small>Design preview<br>All values are examples.</small></aside><main class="workspace">${content}</main>${nav('bottom')}</div>`}
function head(title,sub,action=''){return `<header class="pagehead"><div class="eyebrow">${sub}</div><div class="row spread"><h1>${title}</h1>${action}</div></header>`}
function mini(){return `<div class="mini"><div class="row spread"><strong>bloat.</strong><small>Today</small></div><h2>A little more clarity.</h2><div class="card"><small>Last recorded strength</small><div class="row spread"><div class="metric">3<small> / 10</small></div><div class="ring">3</div></div><small>Example entry · 12:40 pm</small></div><div class="card"><strong>Your week</strong>${bars()}</div><div class="note" style="margin-top:16px">Symptoms, meals and daily context.<br>One clear record.</div></div>`}
function render(){let r=location.hash.slice(1)||'home';let s='';if(r==='home')s=top()+`<main><section class="hero"><div><span class="eyebrow">Your day. In perspective.</span><h1>Understand<br>your patterns.<br><span style="color:#75757d">One day<br>at a time.</span></h1><p class="muted">A quieter way to record bloating, meals and daily habits. Bring a clearer picture to your next conversation.</p><div class="row wrap">${link('today','Explore the demo →','btn primary')}${link('how','How Bloat works','btn')}</div><p style="font-size:12px;margin-top:18px">Design preview. Sample records only.</p></div><div class="device">${mini()}</div></section><section class="section"><h2>Less to remember. More to see.</h2><div class="three">${[['01','Record the moment','Log when bloating starts, how strong it feels and when it ends.'],['02','Add the context','Keep meals and everyday habits alongside your symptoms.'],['03','Review your records','See your history and prepare a report for a conversation with your doctor.']].map(x=>`<article class="card"><span class="step">${x[0]}</span><h3>${x[1]}</h3><p class="muted">${x[2]}</p></article>`).join('')}</div></section></main>`+footer();
else if(r==='today')s=shell(head('Today','Thursday · 19 November',btn('＋ Log bloating','bloat','primary'))+`<div class="grid"><section class="card"><div class="row spread"><h3>${ongoing?'Bloating in progress':'Your latest entry'}</h3><span class="badge">${ongoing?'Ongoing':'Sample record'}</span></div><div class="row spread" style="margin-top:28px"><div><div class="metric">${ongoing?strength:3}<small> / 10</small></div><p class="muted">Recorded strength</p></div><div class="ring">${ongoing?strength:3}</div></div><div class="divider"></div><div class="row spread"><small>${ongoing?'Started just now':'12:40 pm · Ended at 1:15 pm'}</small>${btn(ongoing?'End episode':'View entry',ongoing?'end':'detail','small')}</div></section><section class="card"><h3>Make a quick note</h3><p class="muted" style="margin-top:8px">Small entries build your daily picture.</p><div class="actions">${btn('＋ Meal','meal')}${btn('＋ Activity','activity')}${btn('Morning review','review')}${link('history','View history','btn')}</div></section><section class="card wide"><div class="row spread"><h3>Your week</h3>${link('insights','Explore patterns →','small')}</div>${chart()}<small>Illustrative data · Recorded strength, not a calculated Bloat Score</small></section><section class="card wide"><div class="row spread"><h3>Today’s timeline</h3><span class="badge">Example entries</span></div>${meals.map(m=>`<div class="entry"><div><strong>${escapeText(m)}</strong><small>Meal · Added in this demo</small></div><span>Saved locally</span></div>`).join('')}<div class="entry"><div><strong>Lunch</strong><small>12:15 pm · Rice, vegetables and yoghurt</small></div>${btn('View','mealDetail','small')}</div><div class="entry"><div><strong>Bloating entry</strong><small>12:40 pm · Strength 3 / 10</small></div>${btn('View','detail','small')}</div></section></div>`,r);
else if(r==='history')s=shell(head('Your history','Every entry, in context')+`<div class="card"><div class="row spread"><h3>19 November</h3>${btn('＋ Add meal','meal','small')}</div><div class="entry"><div><strong>Morning review</strong><small>8:30 am · Completed example</small></div>${btn('Review','review','small')}</div><div class="entry"><div><strong>Lunch</strong><small>12:15 pm · Meal record</small></div>${btn('View','mealDetail','small')}</div><div class="entry"><div><strong>Bloating</strong><small>12:40–1:15 pm · Strength 3 / 10</small></div>${btn('View entry','detail','small')}</div></div><div class="card" style="margin-top:24px"><h3>18 November</h3><p class="muted" style="margin-top:12px">No entries recorded. Missing data does not mean no symptoms.</p></div>`,r);
else if(r==='insights')s=shell(head('Your patterns','A view over time',`<span class="badge">Pro · Design example</span>`)+`<div class="grid"><div class="card wide"><div class="row spread"><h3>Recorded symptom strength</h3><div class="tabs">${['7 days','30 days'].map(t=>btn(t,'range:'+t,range===t?'selected':'')).join('')}</div></div>${range==='7 days'?chart():'<div class="note" style="margin-top:32px">Only seven days are included in this prototype. A 30-day chart would use actual eligible records.</div>'}<small>Sample data · No clinical interpretation</small></div><div class="card"><h3>Possible associations</h3><div class="note" style="margin-top:24px">Not enough comparable days yet.</div><p class="muted" style="margin-top:20px">Keep recording your usual routine. We won’t fill missing days with zeroes or invent a result.</p></div><div class="card"><h3>A clearer conversation</h3><p class="muted" style="margin:24px 0">Choose what to include before preparing a report.</p>${link('report','Prepare a report','btn primary full')}</div></div>`,r);
else if(r==='me')s=shell(head('You','Preferences and your data')+`<div class="grid"><div class="card"><h3>Your account</h3>${[['Profile and preferences','preferences'],['Privacy and sharing','privacy'],['Download your records','export'],['Help and contact','contact']].map(([t,a])=>`<div class="entry"><span>${t}</span>${btn('Open',a,'small')}</div>`).join('')}${link('signin','Sign out of demo','btn full')}</div><div class="card"><h3>Your records, your choices</h3><p class="muted" style="margin:22px 0">Review what is included in a report before sharing it.</p>${link('report','Review report settings →','btn full')}<div class="divider"></div><p class="muted">This prototype holds no account or personal records. Refreshing clears demo entries.</p></div></div>`,r);
else if(r==='signin')s=top()+`<main class="auth"><section class="card"><span class="eyebrow">Welcome back</span><h1 style="margin-top:18px">Your day,<br>in one place.</h1><p class="muted" style="margin-top:16px">Design preview of the testing sign-in screen.</p><div class="note" style="margin-top:24px">No real credentials here. Use the demo button below.</div><label class="field">Email<input type="email" placeholder="you@example.com" disabled></label><label class="field">Password<input type="password" placeholder="Your password" disabled></label>${link('today','Explore signed-in demo →','btn primary full')}<p style="font-size:13px;margin-top:20px">Testing accounts are provisioned by the owner. Public signup and password recovery depend on the configured authentication service.</p></section></main>`+footer();
else if(r==='setup')s=top()+`<main class="auth"><section class="card"><span class="eyebrow">Setup · Design example</span><h1 style="margin:18px 0">Start with<br>what matters.</h1><p class="muted">Existing eligibility, safety and consent steps must come first. This is a visual example of the goals step.</p><label class="field">Your focus<select><option>Keep a daily record</option><option>Prepare for a doctor visit</option></select></label><p class="note" style="margin:24px 0">Production choices must come from the approved question registry.</p>${link('today','Continue to demo','btn primary full')}${link('signin','← Back to sign in','btn quiet full')}</section></main>`+footer();
else if(r==='report')s=shell(head('Your report','Choose what to include')+`<div class="grid"><div class="card"><h3>Report contents</h3><p class="muted" style="margin-top:12px">Preview settings only. No records are shared.</p>${['Bloating entries','Meals','Medicines','Optional personal context'].map((t,i)=>`<label class="entry"><span>${t}</span><input class="reportcheck" type="checkbox" ${i<2?'checked':''} aria-label="Include ${t}"></label>`).join('')}${btn('Preview report','previewReport','primary full')}</div><div class="card"><span class="eyebrow">Before you share</span><h2 style="margin-top:22px">Only what<br>you choose.</h2><p class="muted" style="margin-top:22px">Excluded sections must disappear from the summary, preview, PDF and shared view.</p></div></div>`,'insights');
else {let pages={about:['About Bloat','A daily record, with room for context.','Bloat is being built to help adults keep a structured record of bloating, meals and daily habits. It is a wellness diary, not a diagnosis.','Before launch','Add verified company details and a factual team story. Do not invent clinicians, research partners, endorsements or user counts.'],how:['How Bloat works','Record. Review. Discuss.','Record symptoms and meals, review changes over time, and prepare a record for a conversation with your doctor.','Understand the numbers','The shipped methodology and eligibility rules remain the source of truth. A visual redesign must not change how scores or comparisons are calculated.'],privacy:['Privacy','Clear choices about your records.','Design template only. This is not a finished privacy policy. Preserve existing reviewed policy wording while verifying it against the actual data flows.','Required sections','Data collected; purposes; service providers; retention; export and deletion; sharing controls; contact details; effective date. Do not promise encryption or compliance that has not been verified.'],terms:['Terms','Know what you are using.','Design template only. Reuse and review the actual terms before publication.','Required sections','Eligibility, wellness scope, account responsibilities, subscription terms when applicable, service limitations, support contact and effective date.'],contact:['Contact','A clear place to get help.','A verified support inbox has not been supplied for this design. Do not publish a fake address or a form that only pretends to send.','For the implementation','Connect a real monitored destination, show submission success only after server acknowledgement, and keep health data out of support requests.'],help:['Medical help','Important information, easy to find.','The existing approved safety wording must be preserved verbatim in implementation. This prototype does not reproduce or replace it.','Design rule','Keep urgent information prominent, with text and icons as well as any semantic colour. Never hide safety guidance behind login or a paid plan.'],learn:['Learn','Understand the information behind your records.','Publish only articles whose wording and supporting sources have been reviewed.','Not ready yet','Unreviewed outlines remain drafts. Do not fill this page with generated medical advice.']};let p=pages[r]||pages.about;s=top()+`<main class="document">${link('home','← Home','btn quiet')}<div class="eyebrow" style="margin-top:24px">Bloat / ${p[0]}</div><h1>${p[1]}</h1><p class="muted">${p[2]}</p><h2>${p[3]}</h2><p>${p[4]}</p>${r==='how'?link('setup','Preview setup →','btn primary'):''}</main>`+footer()}
app.innerHTML=s;document.title=`Bloat · ${r} · Design prototype`;window.scrollTo(0,0)}
function escapeText(t){return t.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let toastTimer;function toast(t){const n=document.querySelector('#toast');n.textContent=t;n.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.hidden=true,4500)}
function modal(title,body){sheet.innerHTML=`<div class="row spread"><h2>${title}</h2>${btn('Close','close','small')}</div>${body}`;sheet.showModal()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;if(a==='close'){sheet.close();return}if(a.startsWith('range:')){range=a.slice(6);render();return}if(a==='bloat'){if(ongoing){toast('An episode is already ongoing. End it before starting another.');return}strength=null;modal('Log bloating',`<p class="muted">How strong does it feel right now?</p><div class="numbergrid">${Array.from({length:10},(_,i)=>`<button data-action="strength:${i+1}" aria-pressed="false">${i+1}</button>`).join('')}</div><div class="labelrow"><span>1 · Very mild</span><span>10 · Worst imaginable</span></div><div class="note" style="margin:24px 0">Demo only. The production flow must retain the approved safety questions.</div><button id="start" data-action="start" class="primary full" disabled>Start episode</button>`)}else if(a.startsWith('strength:')){strength=+a.split(':')[1];sheet.querySelectorAll('[aria-pressed]').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));sheet.querySelector('#start').disabled=false}else if(a==='start'){ongoing=true;sheet.close();render();toast('Episode started in this demo. No server write.')}else if(a==='end'){ongoing=false;render();toast('Episode ended in this demo.')}else if(a==='meal'){modal('Add a meal',`<form id="mealform"><label class="field">What did you have?<input id="mealtext" required maxlength="160" placeholder="For example, rice and vegetables"></label><p class="muted" style="margin:16px 0">Type a sample meal. No AI check is performed.</p><button class="primary full" type="submit">Save demo meal</button></form>`)}else if(a==='previewReport'){const chosen=[...document.querySelectorAll('.reportcheck:checked')].map(x=>x.getAttribute('aria-label').replace('Include ',''));modal('Report preview',`<p class="muted" style="margin:20px 0">Synthetic layout preview only.</p><div class="note">Included: ${chosen.join(', ')||'No sections selected'}.</div><p style="margin:20px 0">No PDF was generated and nothing was shared.</p>`)}else if(a==='detail'){modal('Bloating entry',`<p class="previewlabel">Synthetic record · 19 November</p><div class="metric">3<small> / 10</small></div><p class="muted" style="margin-top:12px">12:40–1:15 pm · Recorded strength</p><p class="note" style="margin-top:24px">Production: edit with validation and preserve the original entry until saving succeeds.</p>`)}else if(a==='mealDetail'){modal('Lunch',`<p style="margin-top:20px">Rice, vegetables and yoghurt</p><p class="muted">12:15 pm · Synthetic example</p>`)}else if(['privacy','contact'].includes(a)){location.hash=a}else{modal(({activity:'Add activity',review:'Morning review',preferences:'Preferences',export:'Download records'})[a]||'Preview',`<p class="note" style="margin-top:20px">This screen is specified in the handoff. The prototype does not simulate this server action or claim it succeeded.</p>`)}});
document.addEventListener('submit',e=>{if(e.target.id==='mealform'){e.preventDefault();let v=document.querySelector('#mealtext').value.trim();if(!v)return;meals.unshift(v);sheet.close();location.hash='today';render();toast('Demo meal added. Refresh clears sample entries.')}});window.addEventListener('hashchange',()=>{if(sheet.open)sheet.close();render()});render();
</script></body></html>
